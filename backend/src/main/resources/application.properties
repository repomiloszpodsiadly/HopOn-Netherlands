# H2 lives only in memory; saved data is reset when this backend process stops.
# The Angular dev server proxies browser API calls, so keep Spring on loopback.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:hopon;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
