<div class="map-viewport" [class.map-viewport--unavailable]="mapUnavailable()">
  <div
    #mapHost
    class="map-viewport__canvas"
    [class.map-viewport__canvas--hidden]="mapUnavailable()"
    [attr.data-map-ready]="mapReady()"
    [attr.data-map-places-ready]="placesRendered()"
    role="region"
    tabindex="-1"
    [attr.aria-label]="'Interactive map of Amsterdam, Rotterdam and Utrecht'"
  ></div>

  @if (!mapReady() && !mapUnavailable()) {
    <div class="map-viewport__loading" role="status" aria-live="polite">
      <span class="map-viewport__spinner" aria-hidden="true"></span>
      <span>Loading the map for three Dutch cities…</span>
    </div>
  }

  @if (mapUnavailable()) {
    <div class="map-viewport__fallback" role="status" aria-live="polite">
      <span class="map-viewport__fallback-icon" aria-hidden="true">↗</span>
      <h3>Map unavailable</h3>
      <p>The city guide is still available. Check your connection or browse the place list.</p>
      <div class="map-viewport__fallback-actions">
        <button type="button" class="button button--primary" (click)="retry()">Retry map</button>
      </div>
      <div class="map-viewport__attribution">
        <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a>
        · © <a href="https://openmaptiles.org/" target="_blank" rel="noopener noreferrer">OpenMapTiles</a>
        · © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap contributors</a>
      </div>
    </div>
  }
</div>
