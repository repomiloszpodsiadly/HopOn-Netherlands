<dialog
  #dialog
  class="confirm-dialog"
  [id]="dialogId"
  tabindex="-1"
  aria-modal="true"
  [attr.aria-labelledby]="dialogId + '-title'"
  [attr.aria-describedby]="dialogId + '-description'"
  (cancel)="handleCancel($event)"
  (keydown)="handleKeydown($event)"
  (click)="handleBackdropClick($event)"
>
  <section class="confirm-dialog__panel">
    <div class="confirm-dialog__header">
      <span class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="destructive" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          @if (destructive) {
            <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5" />
          } @else {
            <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M8 9h3M8 13h2m4-8 3 3m-6 5 1-4 6-6a2.1 2.1 0 0 1 3 3l-6 6-4 1Z" />
          }
        </svg>
      </span>
      <h2 [id]="dialogId + '-title'">{{ heading }}</h2>
    </div>
    <p [id]="dialogId + '-description'">{{ description }}</p>
    @if (message) {
      <p class="confirm-dialog__message" role="alert">{{ message }}</p>
    }
    <div class="confirm-dialog__actions">
      <button #cancelButton class="confirm-dialog__button confirm-dialog__button--quiet" type="button" [disabled]="busy" (click)="cancel()">
        {{ cancelLabel }}
      </button>
      <button class="confirm-dialog__button confirm-dialog__button--confirm" [class.confirm-dialog__button--danger]="destructive" type="button" [disabled]="busy" (click)="confirm()">
        {{ busy ? 'Please wait…' : confirmLabel }}
      </button>
    </div>
  </section>
</dialog>
